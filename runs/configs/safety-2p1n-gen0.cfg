SPECIFICATION SafetySpec

CONSTANTS
  Pods = {p1, p2}
  Nodes = {n1}
  GpuPods = {p1, p2}
  GatedPods = {p2}
  MaxGeneration = 0
  MaxBackoff = 1
  NodeCapacity = 2

INVARIANTS
  TypeOK
  NoLeakedReservations
  SingleBinding
  AssignedImpliesBindHistory
  AssignedPhasesHaveNode
  ReservationPrecedesCurrentBind
  BackoffConsistency
  BindHistoryNotFromFuture
  UnassignedPhasesHaveNoNode
  NonReservedPhasesHaveNoReservation
  GateConsistency
  NoCapacityOvercommit
